<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo de Juros Compostos</title>
  <link rel="stylesheet" href="pratica03exercicio06.css">
</head>
<body>

  <div class="container">
    <h2>Juros Compostos</h2>
    
    <label for="capital">Capital Inicial (C):</label>
    <input type="number" id="capital" placeholder="Ex: 1000">

    <label for="taxa">Taxa de Juros % (i):</label>
    <input type="number" id="taxa" placeholder="Ex: 5">

    <label for="tempo">Prazo/Tempo (t):</label>
    <input type="number" id="tempo" placeholder="Ex: 12">

    <button onclick="calcularMontante()">Calcular Montante</button>
    <p id="resultado"></p>
  </div>

  <script src="pratica03exercicio06.js"></script>
</body>
</html>
